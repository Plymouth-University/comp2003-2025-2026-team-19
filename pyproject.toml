[project]
name = "ferrytracker"
version = "0.1.0"
description = ""
authors = [
    {name = "isaa-ctaylor",email = "isaac@isaactaylor.xyz"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.14"
packages = [{include="core"}]
dependencies = [
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "geoalchemy2 (>=0.18.1,<0.19.0)",
    "sentry-sdk (>=2.51.0,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "websockets (>=16.0,<17.0)",
    "redis (>=7.2.0,<8.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-extra-types (>=2.11.1,<3.0.0)",
]

[tool.poetry]
package-mode = false
packages = [{include = "core"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "testcontainers[postgresql] (>=4.14.2,<5.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx-ws (>=0.9.0,<0.10.0)",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:sentry_sdk.*",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette.*"
]