name: ferrytracker

services:
  volume-init:
    image: busybox
    command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql/data"]
    volumes:
      - ferrytracker_postgres:/var/lib/postgresql/data

  postgis:
    image: postgis/postgis:18-3.6-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - ferrytracker_postgres:/var/lib/postgresql/data
      - ./database/scripts/01-init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.6-alpine
    restart: always
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  migrations:
    build:
      context: .
      dockerfile: ./database/migrations/Dockerfile
    env_file:
      - .env
    depends_on:
      postgis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: ./web/api/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ./web/frontend/Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - ./web/api/assets:/app/assets:ro
    depends_on:
      api:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  ingestion-server:
    build:
      context: .
      dockerfile: ./ingestion/server/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=ingestion
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    build: ./nginx
    restart: always
    ports:
      - "20003:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      ingestion-server:
        condition: service_healthy

  mqtt-auth:
    build:
      context: .
      dockerfile: ./mqtt/auth/Dockerfile
    env_file:
      - .env
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: vernemq/vernemq
    ports:
      - "8883:8883"
    environment:
      - DOCKER_VERNEMQ_ACCEPT_EULA=yes
    volumes:
      - ./mqtt/config/vernemq.conf:/vernemq/vernemq.conf.template:ro
      - ./mqtt/config/certs:/etc/vernemq/certs:ro
    entrypoint: ["/bin/sh", "-c", "cp /vernemq/vernemq.conf.template /etc/vernemq/vernemq.conf && exec start_vernemq"]
    depends_on:
      mqtt-auth:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ferrytracker_postgres:
  mqtt_data:
  mqtt_log: