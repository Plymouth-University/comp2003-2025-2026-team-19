name: ferrytracker

services:
    db:
        image: postgis/postgis:18-3.6-alpine
        env_file:
            - .env
        volumes:
            - ferrytracker_postgres:/var/lib/postgresql/data
            - ./database/scripts/01-init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 2s
            timeout: 2s
            retries: 5
            start_period: 20s
    redis:
        image: redis:8.6-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            retries: 3
    api:
        build:
            context: .
            dockerfile: ./web/api/Dockerfile
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        # ports:
        #     - "8080:8080"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://api:8080/api/v1/status"]
            interval: 10s
            retries: 3
    frontend:
        build:
            context: .
            dockerfile: ./web/frontend/Dockerfile
        env_file:
            - .env
        # depends_on:
        #     api:
        #         condition: service_healthy
    ingestion-server:
        build:
            context: .
            dockerfile: ./ingestion/server/Dockerfile
        env_file:
            - .env
        environment:
            - SERVICE_TYPE=ingestion
        depends_on:
            db:
                condition: service_healthy
        # ports:
        #     - "8081:8080"

    gateway:
        build: ./nginx
        ports:
            - "20003:80"
        depends_on:
            # api:
            #     condition: service_healthy
            ingestion-server:
                condition: service_started


volumes:
    ferrytracker_postgres: