name: ferrytracker

services:
  postgis:
    image: postgis/postgis:18-3.6-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - ferrytracker_postgres:/var/lib/postgresql/data
      - ./database/scripts/01-init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.6-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: ./web/api/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ./web/frontend/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  ingestion-server:
    build:
      context: .
      dockerfile: ./ingestion/server/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=ingestion
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    build: ./nginx
    restart: always
    ports:
      - "20003:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      ingestion-server:
        condition: service_healthy

volumes:
  ferrytracker_postgres: