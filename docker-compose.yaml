name: ferrytracker

services:
    db:
        image: postgis/postgis:18-3.6-alpine
        env_file:
            - ./database/.env
        volumes:
            - postgres:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 2s
            timeout: 2s
            retries: 5
            start_period: 20s
    api:
        build: ./api
        env_file:
            - ./api/.env
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8000:8000"

volumes:
    postgres: